name: 32-Deploy api

on:
  push:
    branches: [main]
    paths:
      - 'swagger/**'
      - 'bicep/apps/api.bicep'
      - 'bicep/settings.bicep'
      - '.github/workflows/32-deploy-api.yml'
      - '.github/workflows/reusable-api.yml'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run the integration tests after deploying'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# dev -> uat -> prd; uat and prd wait for the approval configured on the GitHub environments of the same name.
jobs:
  dev:
    uses: ./.github/workflows/reusable-api.yml
    secrets: inherit
    with:
      env_name: dev
      run_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}

  uat:
    needs: dev
    uses: ./.github/workflows/reusable-api.yml
    secrets: inherit
    with:
      env_name: uat
      run_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}

  prd:
    needs: uat
    uses: ./.github/workflows/reusable-api.yml
    secrets: inherit
    with:
      env_name: prd
      run_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
