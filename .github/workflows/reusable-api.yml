name: Reusable - api (one environment)

on:
  workflow_call:
    inputs:
      env_name:
        type: string
        required: true
      run_tests:
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate swagger is valid JSON
        run: jq empty swagger/swagger.json

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Needs the function code from workflow 31 (the function host key must exist).
      - name: Deploy api.bicep
        shell: bash
        run: |
          az deployment group create \
            --name "api-${{ github.run_number }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file bicep/apps/api.bicep \
            --parameters baseName="${{ vars.BASE_NAME }}" envName="${{ inputs.env_name }}" \
            --query properties.outputs \
            --output json > outputs.json

      - name: Summary
        run: |
          {
            echo "### API deployed (${{ inputs.env_name }})"
            echo "API base URL: $(jq -r .apiBaseUrl.value outputs.json)"
            echo "APIM MCP endpoint: $(jq -r .mcpEndpoint.value outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Integration tests
        if: inputs.run_tests
        uses: ./.github/actions/test-api
        with:
          env-name: ${{ inputs.env_name }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          base-name: ${{ vars.BASE_NAME }}
