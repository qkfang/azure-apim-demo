name: 10-Deploy platform

on:
  push:
    branches: [main]
    paths:
      - 'bicep/platform/**'
      - 'bicep/settings.bicep'
      - '.github/workflows/10-deploy-platform.yml'
      - '.github/workflows/reusable-platform.yml'
  pull_request:
    paths:
      - 'bicep/platform/**'
      - 'bicep/settings.bicep'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after what-if (uncheck for a what-if only run)'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# dev runs first (what-if only on pull requests); uat and prd run in order and wait for the approval
# configured as required reviewers on the GitHub environments of the same name.
jobs:
  dev:
    uses: ./.github/workflows/reusable-platform.yml
    secrets: inherit
    with:
      env_name: dev
      deploy: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}

  uat:
    needs: dev
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    uses: ./.github/workflows/reusable-platform.yml
    secrets: inherit
    with:
      env_name: uat

  prd:
    needs: uat
    uses: ./.github/workflows/reusable-platform.yml
    secrets: inherit
    with:
      env_name: prd
