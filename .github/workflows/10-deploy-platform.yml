name: 10-Deploy platform

on:
  push:
    branches: [main]
    paths:
      - 'bicep/platform/**'
      - '.github/workflows/10-deploy-platform.yml'
  pull_request:
    paths:
      - 'bicep/platform/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after what-if (uncheck for a what-if only run)'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  BASE_NAME: ${{ vars.BASE_NAME }}
  PUBLISHER_EMAIL: ${{ vars.PUBLISHER_EMAIL }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}

jobs:
  validate:
    name: Lint and what-if
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Lint Bicep
        run: |
          az bicep build --file bicep/platform/main.bicep --stdout > /dev/null

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --parameters bicep/platform/main.bicepparam

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy main.bicep
        id: deploy
        shell: bash
        run: |
          az deployment group create \
            --name "infra-${{ github.run_number }}" \
            --resource-group "$RESOURCE_GROUP" \
            --parameters bicep/platform/main.bicepparam \
            --query properties.outputs \
            --output json | tee outputs.json

      - name: Summary
        run: |
          {
            echo "### Infrastructure deployed"
            echo "- APIM gateway: $(jq -r .apimGatewayUrl.value outputs.json)"
            echo "- AI Gateway: $(jq -r .aiGatewayUrl.value outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"
