name: 40-Test API

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/40-test-api.yml'
      - '.github/actions/test-api/**'
  schedule:
    - cron: '0 20 * * *' # daily smoke test of the deployed dev API
  workflow_dispatch:
    inputs:
      env_name:
        description: 'Environment to test'
        type: choice
        options: [dev, uat, prd]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Integration tests (${{ inputs.env_name || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: ./.github/actions/test-api
        with:
          env-name: ${{ inputs.env_name || 'dev' }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          base-name: ${{ vars.BASE_NAME }}
