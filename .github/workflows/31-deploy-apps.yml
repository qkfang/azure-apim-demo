name: 31-Deploy apps

on:
  push:
    branches: [main]
    paths:
      - 'src/functionapp/**'
      - 'bicep/apps/functionapp.bicep'
      - 'bicep/settings.bicep'
      - '.github/workflows/31-deploy-apps.yml'
      - '.github/workflows/reusable-apps.yml'
  pull_request:
    paths:
      - 'src/functionapp/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Azure (uncheck to only build and test)'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  APP_DIR: src/functionapp
  NODE_VERSION: '20.x'

# Build once, then dev -> uat -> prd; uat and prd wait for the approval configured on the GitHub environments
# of the same name. The same package is deployed to every environment.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install and test
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm test

      - name: Install production dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --omit=dev

      - name: Package
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../../functionapp.zip . -x "test/*" "local.settings*.json"

      - uses: actions/upload-artifact@v4
        with:
          name: functionapp
          path: functionapp.zip

  dev:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    uses: ./.github/workflows/reusable-apps.yml
    secrets: inherit
    with:
      env_name: dev

  uat:
    needs: dev
    uses: ./.github/workflows/reusable-apps.yml
    secrets: inherit
    with:
      env_name: uat

  prd:
    needs: uat
    uses: ./.github/workflows/reusable-apps.yml
    secrets: inherit
    with:
      env_name: prd
