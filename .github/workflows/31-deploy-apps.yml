name: 31-Deploy apps (Function App)

on:
  push:
    branches: [main]
    paths:
      - 'src/functionapp/**'
      - 'bicep/apps/functionapp.bicep'
      - '.github/workflows/31-deploy-apps.yml'
  pull_request:
    paths:
      - 'src/functionapp/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Azure (uncheck to only build and test)'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  APP_DIR: src/functionapp
  NODE_VERSION: '20.x'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install and test
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm test

      - name: Install production dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --omit=dev

      - name: Package
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../../functionapp.zip . -x "test/*" "local.settings*.json"

      - uses: actions/upload-artifact@v4
        with:
          name: functionapp
          path: functionapp.zip

  function-app:
    name: Deploy Function App (infra + code)
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: functionapp

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The API needs the function host key, which only exists once the code is deployed, so the API is
      # published separately by workflow 32.
      - name: Deploy apps/main.bicep (Function App only)
        shell: bash
        run: |
          az deployment group create \
            --name "apps-func-${{ github.run_number }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file bicep/apps/main.bicep \
            --parameters baseName="${{ vars.BASE_NAME }}" deployApi=false \
            --query properties.outputs \
            --output json

      - name: Deploy zip package
        uses: Azure/functions-action@v1
        with:
          app-name: func-${{ vars.BASE_NAME }}
          package: functionapp.zip
