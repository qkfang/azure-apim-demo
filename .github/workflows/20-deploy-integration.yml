name: 20-Deploy integration

on:
  push:
    branches: [main]
    paths:
      - 'bicep/integration/**'
      - '!bicep/integration/plan.bicep'
      - '!bicep/integration/main.bicep'
      - 'bicep/settings.bicep'
      - '.github/workflows/20-deploy-integration.yml'
      - '.github/workflows/reusable-integration.yml'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run the integration tests after deploying'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# dev -> uat -> prd; uat and prd wait for the approval configured on the GitHub environments of the same name.
jobs:
  dev:
    uses: ./.github/workflows/reusable-integration.yml
    secrets: inherit
    with:
      env_name: dev
      run_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}

  uat:
    needs: dev
    uses: ./.github/workflows/reusable-integration.yml
    secrets: inherit
    with:
      env_name: uat
      run_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}

  prd:
    needs: uat
    uses: ./.github/workflows/reusable-integration.yml
    secrets: inherit
    with:
      env_name: prd
      run_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
