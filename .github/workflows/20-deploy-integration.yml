name: 20-Deploy integration

on:
  push:
    branches: [main]
    paths:
      - 'bicep/integration/**'
      - '.github/workflows/20-deploy-integration.yml'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run the integration tests after deploying'
        type: boolean
        default: true
  workflow_call:
    inputs:
      skip_tests:
        description: 'Skip the integration tests (the calling workflow runs them)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy integration/main.bicep
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Validate swagger is valid JSON
        run: jq empty swagger/swagger.json

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Client access, the workspace and the AI Gateway registration need the apps team's API and function code
      # (workflow 32). Before that exists (first deployment) only the App Service plan is deployed.
      - name: Check whether the apps deployment exists
        id: apps
        shell: bash
        run: |
          if az apim api show -g "${{ vars.AZURE_RESOURCE_GROUP }}" --service-name "apim-${{ vars.BASE_NAME }}" --api-id products-api --output none 2>/dev/null; then
            echo "deploy_app_integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_app_integration=false" >> "$GITHUB_OUTPUT"
            echo "::notice::products-api not found - deploying only the App Service plan. Workflow 32 completes the integration."
          fi

      - name: Deploy integration/main.bicep
        shell: bash
        run: |
          az deployment group create \
            --name "integration-${{ github.run_number }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file bicep/integration/main.bicep \
            --parameters baseName="${{ vars.BASE_NAME }}" deployAppIntegration=${{ steps.apps.outputs.deploy_app_integration }} \
            --query properties.outputs \
            --output json > outputs.json

      - name: Summary
        run: |
          {
            echo "App Service plan: $(jq -r .planName.value outputs.json)"
            echo "Workspace API base URL: $(jq -r .workspaceApiBaseUrl.value outputs.json)"
            echo "AI Gateway MCP endpoint: $(jq -r .aiGatewayMcpEndpoint.value outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test deployed API
    needs: deploy
    if: ${{ !inputs.skip_tests && (github.event_name == 'push' || inputs.run_tests) }}
    uses: ./.github/workflows/40-test-api.yml
    secrets: inherit
