name: Reusable - platform (one environment)

on:
  workflow_call:
    inputs:
      env_name:
        type: string
        required: true
      deploy:
        description: 'Deploy after what-if (false for a what-if only run)'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  platform:
    name: Lint, what-if and deploy (${{ inputs.env_name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    env:
      ENV_NAME: ${{ inputs.env_name }}
      BASE_NAME: ${{ vars.BASE_NAME }}
      PUBLISHER_EMAIL: ${{ vars.PUBLISHER_EMAIL }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint Bicep
        run: az bicep build --file bicep/platform/main.bicep --stdout > /dev/null

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --parameters bicep/platform/main.bicepparam

      - name: Deploy main.bicep
        if: inputs.deploy
        run: |
          az deployment group create \
            --name "infra-${{ github.run_number }}" \
            --resource-group "$RESOURCE_GROUP" \
            --parameters bicep/platform/main.bicepparam \
            --query properties.outputs \
            --output json | tee outputs.json

      - name: Summary
        if: inputs.deploy
        run: |
          {
            echo "### Infrastructure deployed (${{ inputs.env_name }})"
            echo "- APIM gateway: $(jq -r .apimGatewayUrl.value outputs.json)"
            echo "- AI Gateway: $(jq -r .aiGatewayUrl.value outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"
