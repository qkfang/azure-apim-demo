name: 03-Publish API to APIM

on:
  push:
    branches: [main]
    paths:
      - 'swagger/**'
      - 'bicep/apps/api.bicep'
      - '.github/workflows/03-deploy-api.yml'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run the integration tests after publishing'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Import swagger and MCP server into APIM
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Validate swagger is valid JSON
        run: jq empty swagger/swagger.json

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy api.bicep
        shell: bash
        run: |
          az deployment group create \
            --name "api-${{ github.run_number }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file bicep/apps/api.bicep \
            --parameters baseName="${{ vars.BASE_NAME }}" \
            --query properties.outputs \
            --output json > outputs.json

      - name: Summary
        run: |
          {
            echo "API base URL: $(jq -r .apiBaseUrl.value outputs.json)"
            echo "APIM MCP endpoint: $(jq -r .mcpEndpoint.value outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test deployed API
    needs: publish
    if: github.event_name == 'push' || inputs.run_tests
    uses: ./.github/workflows/04-test-api.yml
    secrets: inherit
