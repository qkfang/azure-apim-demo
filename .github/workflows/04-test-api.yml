name: 04-Test deployed API

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/04-test-api.yml'
  schedule:
    - cron: '0 20 * * *' # daily smoke test of the deployed API
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Integration tests (Function App + APIM)
    runs-on: ubuntu-latest
    environment: dev
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      FUNC_NAME: func-${{ vars.BASE_NAME }}
      APIM_NAME: apim-${{ vars.BASE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve endpoints and keys
        run: |
          FUNC_HOST=$(az functionapp show -g "$RESOURCE_GROUP" -n "$FUNC_NAME" --query defaultHostName -o tsv)
          FUNC_KEY=$(az functionapp keys list -g "$RESOURCE_GROUP" -n "$FUNC_NAME" --query functionKeys.default -o tsv)
          APIM_URL=$(az apim show -g "$RESOURCE_GROUP" -n "$APIM_NAME" --query gatewayUrl -o tsv)
          SUB_ID=$(az account show --query id -o tsv)
          APIM_KEY=$(az rest --method post \
            --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME/subscriptions/demo-tests/listSecrets?api-version=2023-09-01-preview" \
            --query primaryKey -o tsv)
          echo "::add-mask::$FUNC_KEY"
          echo "::add-mask::$APIM_KEY"
          {
            echo "FUNCTION_BASE_URL=https://$FUNC_HOST/api"
            echo "FUNCTION_KEY=$FUNC_KEY"
            echo "APIM_BASE_URL=$APIM_URL/demo"
            echo "APIM_SUBSCRIPTION_KEY=$APIM_KEY"
          } >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: tests
        run: npm test
