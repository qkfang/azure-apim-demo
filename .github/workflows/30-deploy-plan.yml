name: 30-Deploy App Service plan

on:
  push:
    branches: [main]
    paths:
      - 'bicep/integration/plan.bicep'
      - '.github/workflows/30-deploy-plan.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy integration/main.bicep (plan only)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The rest of integration/main.bicep (client access, workspace, AI Gateway MCP) needs the API from workflow 32.
      - name: Deploy integration/main.bicep (plan only)
        shell: bash
        run: |
          az deployment group create \
            --name "plan-${{ github.run_number }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file bicep/integration/main.bicep \
            --parameters baseName="${{ vars.BASE_NAME }}" deployAppIntegration=false \
            --query properties.outputs \
            --output json
