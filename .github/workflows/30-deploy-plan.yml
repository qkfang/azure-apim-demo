name: 30-Deploy app service plan

on:
  push:
    branches: [main]
    paths:
      - 'bicep/integration/plan.bicep'
      - 'bicep/settings.bicep'
      - '.github/workflows/30-deploy-plan.yml'
      - '.github/workflows/reusable-plan.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# dev -> uat -> prd; uat and prd wait for the approval configured on the GitHub environments of the same name.
jobs:
  dev:
    uses: ./.github/workflows/reusable-plan.yml
    secrets: inherit
    with:
      env_name: dev

  uat:
    needs: dev
    uses: ./.github/workflows/reusable-plan.yml
    secrets: inherit
    with:
      env_name: uat

  prd:
    needs: uat
    uses: ./.github/workflows/reusable-plan.yml
    secrets: inherit
    with:
      env_name: prd
